<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam 2 Practical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">

    <!--Javascripts must be imported to HTML file to run.-->
    <script src="app1.js"></script>
    <script src="users.js"></script>

    <style>
        #message {
            display: inline;
            font-size: small;
            margin: 5px;
        }

        .formContainer {
            padding:1.25rem;
            border: 5px solid lightgray;
            border-radius: 1.25rem;
        }

        #buttonText {
            color:white;
            text-decoration: none;
        }

        .database {
            padding:5.25rem;
        }
    </style>
</head>

<body>
    <script>
        userListController(); //Run the controller to fetch from the API.
    </script>


    <!-- Image and text -->
    <nav class="navbar navbar-light bg-light" style="margin-bottom: 20px">
        <a class="navbar-brand p-2 mb-2" href="index.html">
            Exam 2 Practical
        </a>
    </nav>

    <div class="container">

    <div class="formContainer">
        <h3 style="margin-bottom:2.5%;">Add a New User</h3>
            <form id="userForm">
                <label for="firstname" class="form-label">First Name</label><br>
                <input type="text" id="firstname" name="firstname" class="form-control mb-3"></input>
                <label for="lastname" class="form-label">Last Name</label><br>
                <input type="text" id="lastname" name="lastname" class="form-control mb-3"></input>
                <label for="email" class="form-label">Email</label><br>
                <input type="text" id="email" name="email" class="form-control mb-3"></input>
                <label for="username" class="form-label">User Name</label><br>
                <input type="text" id="username" name="username" class="form-control mb-3"></input>
                <label for="passwd" class="form-label">Password</label><br>
                <input type="text" id="passwd" name="passwd" class="form-control mb-3"></input>
                <label for="urole" class="form-label">U-Role</label><br>
                <input type="text" id="urole" name="urole" class="form-control mb-3"></input>
                <button type="submit" id="submitButton" class="btn btn-primary" href="home.html">Add User</button>
            </form>
        </div>
    </div>

    <div class="database">
        <div class="col">
            <div id="message"></div>
                <table id="usertable" class="table table-bordered table-striped">
                    <!--app.js code fills this table already.-->
                </table>
            </div>
        </div>
    </div>

    <script>
        const submitButton = document.getElementById("submitButton");
        submitButton.addEventListener("click",createNewUser);
    </script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"
        integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"
        integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj"
        crossorigin="anonymous"></script>
    <script src="users.js"></script>
</body>

</html>
